# =========================================================
# Personal Academic Website
# Alireza Kamali Ardakani
# =========================================================

# Site settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Alireza Kamali Ardakani"
title_separator          : "-"
name                     : "Alireza Kamali Ardakani"
description              : "Robotics researcher working on robotic manipulation, dynamics and control, computer vision, and intelligent systems."
url                      : "https://alirezakamali80.github.io"
baseurl                  : ""
repository               : "alirezakamali80/alirezakamali80.github.io"

# General site behavior
breadcrumbs              : false
words_per_minute         : 200
comments:
  provider               : false

# Build settings
markdown                 : kramdown
highlighter              : rouge
permalink                : /:categories/:title/
timezone                 : "Asia/Tehran"

# Markdown / math configuration
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false

# Files and folders to retain in the published website
include:
  - .htaccess
  - _pages
  - files
  - images

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - talkmap.ipynb
  - "*.ipynb"
  - .github

# =========================================================
# Sidebar author profile
# =========================================================
author:
  avatar                 : "profile.jpg"
  name                   : "Alireza Kamali Ardakani"
  pronouns               :
  bio                    : "Robotics researcher focused on robotic manipulation, dynamics and control, computer vision, and intelligent systems."
  location               : "Tehran, Iran"
  employer               : "University of Tehran"
  uri                    :
  email                  : "alirezakamaliardakani@gmail.com"

  # Academic profiles: leave blank until you create them
  googlescholar          : ""
  orcid                  : ""
  researchgate           : ""
  semantic               : ""

  # Professional profiles
  linkedin               : "alireza-kamali-8840a7268"
  github                 : "alirezakamali80"

  # Optional profiles
  kaggle                 : ""
  youtube                : ""
  twitter                : ""
  x                      : ""
  medium                 : ""

# =========================================================
# Website collections
# =========================================================
collections:
  publications:
    output               : true
    permalink            : /publication/:path/

  portfolio:
    output               : true
    permalink            : /portfolio/:path/

  talks:
    output               : true
    permalink            : /talks/:path/

  teaching:
    output               : true
    permalink            : /teaching/:path/

# =========================================================
# Default layouts
# =========================================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      related: false

# =========================================================
# Archives
# =========================================================
category_archive:
  type                   : liquid
  path                   : /categories/

tag_archive:
  type                   : liquid
  path                   : /tags/

# =========================================================
# Plugins
# =========================================================
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
