# =========================================================
# Personal Academic Website Configuration
# Alireza Kamali Ardakani
# =========================================================

# Site settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Alireza Kamali Ardakani"
title_separator          : "-"
name                     : "Alireza Kamali Ardakani"
description              : "Robotics, control systems, computer vision, machine learning, and intelligent robotic manipulation."
url                      : "https://alirezakamali80.github.io"
baseurl                  : ""
repository               : "alirezakamali80/alirezakamali80.github.io"

# Site behavior
breadcrumbs              : false
words_per_minute         : 200
comments:
  provider               : false

# Build settings
markdown                 : kramdown
highlighter              : rouge
permalink                : /:categories/:title/
timezone                 : "America/Chicago"

# Markdown and mathematics
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  footnote_nr            : 1
  entity_output          : as_char
  toc_levels             : 1..6
  smart_quotes           : lsquo,rsquo,ldquo,rdquo
  enable_coderay         : false

# Include useful files/folders in build
include:
  - .htaccess
  - _pages
  - files
  - images

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - talkmap.ipynb
  - "*.ipynb"
  - .github

# =========================================================
# Author / Sidebar Profile
# =========================================================
author:
  avatar                 : "profile.jpg"
  name                   : "Alireza Kamali Ardakani"
  pronouns               :
  bio                    : "M.Sc. student in Mechanical Engineering (Robotics), working on robotic manipulation, control, computer vision, and intelligent systems."
  location               : "Tehran, Iran"
  employer               : "University of Tehran"
  uri                    :
  email                  : "alirezakamaliardakani@gmail.com"

  # Academic profiles
  googlescholar          : ""
  orcid                  : ""
  researchgate           : ""
  semantic               : ""

  # Professional profiles
  linkedin               : "alireza-kamali-8840a7268"
  github                 : "alirezakamali80"

  # Optional profiles: leave blank until you have them
  twitter                : ""
  x                      : ""
  youtube                : ""
  kaggle                 : ""
  medium                 : ""

# =========================================================
# Collections
# =========================================================
collections:
  publications:
    output               : true
    permalink            : /publication/:path/
  portfolio:
    output               : true
    permalink            : /portfolio/:path/
  talks:
    output               : true
    permalink            : /talks/:path/
  teaching:
    output               : true
    permalink            : /teaching/:path/

# =========================================================
# Default page layouts
# =========================================================
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  # Pages
  - scope:
      path: "_pages"
    values:
      layout: single
      author_profile: true

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  # Portfolio projects
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  # Talks: keep for future use, but hide from navigation
  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true
      share: false
      related: false

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      related: false

# =========================================================
# Archive settings
# =========================================================
category_archive:
  type                   : liquid
  path                   : /categories/

tag_archive:
  type                   : liquid
  path                   : /tags/

# =========================================================
# Plugins
# Keep these unless the template's current config differs
# =========================================================
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
